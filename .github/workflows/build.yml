name: Build

on: [push]

env:
  solutionPath: ./Source/Seed.IO.sln
  configuration: Release

jobs:
  build:
    strategy:
      matrix:
        project:
          - Source\Seed.IO\Seed.IO.csproj
    runs-on: ubuntu-latest
    steps:
    - name: CheckOut
      uses: actions/checkout@v3
      with:
        ref: ${{ github.head_ref }} 
        fetch-depth: 0  
    - name: Build 
      uses: ByronMayne/Shared.Actions/build_csharp@1.0.7
      with: 
        publish: false 
        configuration: ${{ env.configuration }}
        solutionOrProjectPath: ${{ matrix.project }}

